
name: Build BIG Delivery Cash APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o BIG_Delivery_Cash_Android_Project.zip -d extracted
          echo "Searching for Android project..."
          find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \( \
              -name settings.gradle \
              -o -name settings.gradle.kts \
            \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found"
            exit 1
          fi

          cd "$PROJECT_DIR"
          echo "Project directory: $PWD"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing; using installed Gradle"
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIG-Delivery-Cash-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

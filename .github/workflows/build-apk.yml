name: Build BIG Delivery Cash APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o BIG_Delivery_Cash_Android_Project.zip -d extracted
          echo "Project files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd extracted
          PROJECT_DIR=$(find . -name gradlew -type f -printf '%h\n' | head -1)
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: Gradle wrapper not found in ZIP"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIG-Delivery-Cash-APK
          path: extracted/**/*.apk
          if-no-files-found: error

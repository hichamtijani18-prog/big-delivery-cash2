name: Build BIG Delivery Cash APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          if [ -f "BIG_Delivery_Cash_Android_Project_Fixed.zip" ]; then
            ZIP_FILE="BIG_Delivery_Cash_Android_Project_Fixed.zip"
          elif [ -f "BIG_Delivery_Cash_Android_Project.zip" ]; then
            ZIP_FILE="BIG_Delivery_Cash_Android_Project.zip"
          else
            echo "ERROR: No Android project ZIP found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \( \
              -name settings.gradle \
              -o -name settings.gradle.kts \
            \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          cd "$PROJECT_DIR"
          echo "Project directory: $PWD"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Using installed Gradle 8.9"
            gradle assembleDebug
          fi

          echo "APK files generated:"
          find . -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIG-Delivery-Cash-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
